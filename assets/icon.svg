<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="YouTube Transcriber">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  <rect x="48" y="48" width="416" height="416" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Media disc -->
  <circle cx="200" cy="256" r="118" fill="#020617" fill-opacity="0.35"/>
  <circle cx="200" cy="256" r="100" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="7"/>

  <!-- Play -->
  <path d="M170 190 L170 322 L290 256 Z" fill="url(#playGrad)"/>

  <!-- Download arrow -->
  <path
    d="M200 300 L200 360 M172 336 L200 364 L228 336"
    fill="none"
    stroke="#7dd3fc"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Waveform (transcription audio) -->
  <rect x="300" y="176" width="20" height="64" rx="10" fill="#e0f2fe"/>
  <rect x="330" y="152" width="20" height="112" rx="10" fill="#bae6fd"/>
  <rect x="360" y="132" width="20" height="152" rx="10" fill="#7dd3fc"/>
  <rect x="390" y="160" width="20" height="96" rx="10" fill="#bae6fd"/>
  <rect x="420" y="188" width="20" height="40" rx="10" fill="#e0f2fe"/>

  <!-- Transcript lines -->
  <line x1="300" y1="316" x2="440" y2="316" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>
  <line x1="300" y1="348" x2="420" y2="348" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
  <line x1="300" y1="380" x2="392" y2="380" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

  <!-- Local / AI spark -->
  <circle cx="404" cy="120" r="20" fill="#fbbf24"/>
  <circle cx="404" cy="120" r="9" fill="#fff7ed"/>
</svg>
