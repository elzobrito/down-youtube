<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YouTube Transcriber">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="170" y1="160" x2="320" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="280" y1="180" x2="420" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" filter="url(#soft)"/>

  <!-- Soft inner highlight -->
  <rect x="48" y="48" width="416" height="416" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Media disc -->
  <circle cx="220" cy="256" r="118" fill="#0b1220" opacity="0.45"/>
  <circle cx="220" cy="256" r="102" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Play / download hybrid -->
  <path
    d="M188 196 L188 316 L292 256 Z"
    fill="url(#playGrad)"
  />
  <!-- Download chevron under play tip -->
  <path
    d="M220 292 L220 348 M196 328 L220 352 L244 328"
    fill="none"
    stroke="#7dd3fc"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Waveform → transcript lines (transcription) -->
  <g fill="url(#waveGrad)" opacity="0.95">
    <rect x="318" y="188" width="18" height="56" rx="9"/>
    <rect x="346" y="168" width="18" height="96" rx="9"/>
    <rect x="374" y="152" width="18" height="128" rx="9"/>
    <rect x="402" y="176" width="18" height="80" rx="9"/>
    <rect x="430" y="198" width="18" height="36" rx="9"/>
  </g>

  <!-- Transcript text lines -->
  <g stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" opacity="0.88">
    <line x1="318" y1="320" x2="448" y2="320"/>
    <line x1="318" y1="348" x2="430" y2="348"/>
    <line x1="318" y1="376" x2="404" y2="376"/>
  </g>

  <!-- Accent spark (local / AI) -->
  <circle cx="400" cy="128" r="18" fill="#fbbf24" opacity="0.95"/>
  <circle cx="400" cy="128" r="8" fill="#fff7ed"/>
</svg>
